<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Circular Path for Top Text -->
    <path id="textPathTop" d="M 50,200 A 150,150 0 1,1 350,200" fill="none" />
    <!-- Circular Path for Bottom Text -->
    <path id="textPathBottom" d="M 350,200 A 150,150 0 0,1 50,200" fill="none" />
  </defs>

  <!-- Outer Double Ring Seal -->
  <circle cx="200" cy="200" r="192" fill="none" stroke="#0A2558" stroke-width="6" stroke-dasharray="8 4" opacity="0.85" />
  <circle cx="200" cy="200" r="180" fill="none" stroke="#0A2558" stroke-width="4" />
  <circle cx="200" cy="200" r="132" fill="none" stroke="#0A2558" stroke-width="2.5" />

  <!-- Star Embellishments -->
  <g fill="#0A2558">
    <polygon points="46,200 48,194 54,194 49,190 51,184 46,188 41,184 43,190 38,194 44,194" transform="translate(6, 0) scale(1.3)" />
    <polygon points="340,200 342,194 348,194 343,190 345,184 340,188 335,184 337,190 332,194 338,194" transform="translate(-16, 0) scale(1.3)" />
  </g>

  <!-- Top Text: GYANDA GLORY PUBLIC SCHOOL -->
  <text fill="#0A2558" font-family="'Outfit', 'Arial Black', sans-serif" font-size="21" font-weight="900" letter-spacing="4">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      GYANDA GLORY PUBLIC SCHOOL
    </textPath>
  </text>

  <!-- Bottom Text: OFFICIAL SEAL • ADMISSIONS -->
  <text fill="#0A2558" font-family="'Outfit', 'Arial Black', sans-serif" font-size="15" font-weight="800" letter-spacing="4.5">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      ★ OFFICIAL SEAL • ADMISSIONS ★
    </textPath>
  </text>

  <!-- Inner Center Graphic: Open Book, Radiant Sun & Flame -->
  <g transform="translate(200, 205)">
    <!-- Sunburst Rays -->
    <path d="M 0,-62 L 6,-42 L -6,-42 Z" fill="#DC2626" opacity="0.9" />
    <path d="M -22,-58 L -12,-40 L -24,-36 Z" fill="#DC2626" opacity="0.9" />
    <path d="M 22,-58 L 24,-36 L 12,-40 Z" fill="#DC2626" opacity="0.9" />
    <path d="M -42,-45 L -26,-30 L -36,-24 Z" fill="#DC2626" opacity="0.9" />
    <path d="M 42,-45 L 36,-24 L 26,-30 Z" fill="#DC2626" opacity="0.9" />
    <path d="M -55,-22 L -34,-14 L -40,-6 Z" fill="#DC2626" opacity="0.9" />
    <path d="M 55,-22 L 40,-6 L 34,-14 Z" fill="#DC2626" opacity="0.9" />

    <!-- Red Rising Sun Semicircle -->
    <path d="M -44,-8 A 44,44 0 0,1 44,-8 Z" fill="#DC2626" opacity="0.9" />

    <!-- Central Flame -->
    <path d="M 0,-48 C 12,-34 16,-20 8,-12 C 4,-8 0,-6 0,-6 C 0,-6 -4,-8 -8,-12 C -16,-20 -12,-34 0,-48 Z" fill="#FFFFFF" />
    <path d="M 0,-40 C 6,-30 8,-18 4,-12 C 2,-9 0,-7 0,-7 C 0,-7 -2,-9 -4,-12 C -8,-18 -6,-30 0,-40 Z" fill="#DC2626" />

    <!-- Open Book -->
    <!-- Left Page -->
    <path d="M -2,-4 C -22,-16 -50,-12 -65,-2 L -65,26 C -50,18 -22,14 -2,26 Z" fill="#0A2558" />
    <path d="M -4,0 C -20,-10 -46,-7 -58,2 L -58,20 C -46,13 -20,10 -4,20 Z" fill="#FFFFFF" />
    <path d="M -6,4 C -20,-6 -42,-3 -54,5 L -54,16 C -42,10 -20,7 -6,16 Z" fill="#0A2558" opacity="0.2" />

    <!-- Right Page -->
    <path d="M 2,-4 C 22,-16 50,-12 65,-2 L 65,26 C 50,18 22,14 2,26 Z" fill="#0A2558" />
    <path d="M 4,0 C 20,-10 46,-7 58,2 L 58,20 C 46,13 20,10 4,20 Z" fill="#FFFFFF" />
    <path d="M 6,4 C 20,-6 42,-3 54,5 L 54,16 C 42,10 20,7 6,16 Z" fill="#0A2558" opacity="0.2" />

    <!-- Book Spine Rib -->
    <line x1="0" y1="-4" x2="0" y2="28" stroke="#0A2558" stroke-width="3" />

    <!-- Established Text -->
    <text x="0" y="44" fill="#0A2558" font-family="'Outfit', sans-serif" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="1.5">
      ESTD. 2026 • REGD.
    </text>
  </g>
</svg>
